version: 3.0.{build}

image: Visual Studio 2022

configuration: Release
platform: Any CPU

install:
  - ps: Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile "$env:TEMP\dotnet-install.ps1"
  - ps: & "$env:TEMP\dotnet-install.ps1" -Channel 10.0 -InstallDir "$env:ProgramFiles\dotnet"
  - dotnet --info

build_script:
  - dotnet build sources\EncodingChecker.sln --configuration %CONFIGURATION%

test_script:
  - dotnet test sources\EncodingChecker.sln --configuration %CONFIGURATION% --no-build

after_build:
  - 7z a EncodingChecker.zip %APPVEYOR_BUILD_FOLDER%\sources\EncodingChecker\bin\%CONFIGURATION%\net10.0-windows\*

artifacts:
  - path: EncodingChecker.zip
    name: EncodingChecker
